[package]
name = "layout-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast layout calculation and drawable rect generator"

[dependencies]
eyre = { workspace = true }
roxmltree = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
serde= { workspace = true, features = ["derive"] }
strum= { workspace = true, features = ["derive", "strum_macros"] }
taffy= { workspace = true, features = ["parse", "serde"] }

[dependencies.leaf-derive]
path = "./derive"
package = "layout-gen-derive"
version = "0.1"

[workspace]
members = [
    "derive",
    "wasm",
    "previewer",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RoganMatrivski/layout-gen"
authors = ["Robin Mauritz <robin@mdev.co.id>"]

[workspace.dependencies]
arboard = "3.6.1"
clap = "4.5"
color-eyre = "0.6"
console_error_panic_hook = "0.1.7"
eframe = "0.35.0"
egui-toast = "0.21.0"
eyre = "0.6.12"
flume = "0.12.0"
layout-gen = { path = "" }
leaf-derive = { path = "derive" }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
quote = "1"
random_color = "1.1.0"
rfd = "0.17.2"
roxmltree = "0.21.1"
serde = "1.0.229"
serde_json = "1.0.151"
strum = "0.28.0"
syn = "2"
taffy = "0.12.2"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.23"
wasm-bindgen = "0.2.84"
wasm-bindgen-test = "0.3.34"

[workspace.metadata.release]
publish = false
tag = true
push = true
