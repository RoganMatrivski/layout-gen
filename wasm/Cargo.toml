[package]
name = "layout-gen-wasm"
version = "0.1.0"
authors = ["Robin Mauritz <robin@mdev.co.id>"]
edition = "2024" # cargo wasm init defaults to 2018, okay?
repository = "https://github.com/RoganMatrivski/layout-gen"
description = "WebAssembly bindings for layout-gen"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = { workspace = true }

# This crate package
layout-gen = { workspace = true }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { workspace = true, optional = true }
eyre.workspace = true
taffy.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
