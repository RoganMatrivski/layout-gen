name: Publish to Crates.io & NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for Trusted Publishing via OIDC (both npm and crates.io)

jobs:
  publish-crates:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Authenticate with crates.io via OIDC
        uses: rust-lang/crates-io-auth-action@v1
        id: cargo-auth

      - name: Publish layout-gen
        run: cargo publish --manifest-path Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cargo-auth.outputs.token }}

  publish-npm:
    name: Publish WASM to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Build WASM Package & Format package.json
        run: |
          cd wasm
          wasm-pack build --target nodejs --out-dir pkg/node --scope robinmauritz
          wasm-pack build --target bundler --out-dir pkg/web --scope robinmauritz

          cd pkg
          cp web/package.json package.json
          cp web/README.md . 2>/dev/null || true
          cp web/LICENSE* . 2>/dev/null || true

          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.type;
            pkg.main = "./node/layout_gen_wasm.js";
            pkg.module = "./web/layout_gen_wasm.js";
            pkg.types = "./web/layout_gen_wasm.d.ts";
            pkg.exports = {
              ".": {
                "node": {
                  "types": "./node/layout_gen_wasm.d.ts",
                  "default": "./node/layout_gen_wasm.js"
                },
                "import": {
                  "types": "./web/layout_gen_wasm.d.ts",
                  "default": "./web/layout_gen_wasm.js"
                },
                "default": "./web/layout_gen_wasm.js"
              }
            };
            pkg.files = ["node", "web", "LICENSE-APACHE", "LICENSE-MIT", "README.md"];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          # Remove .gitignore files generated by wasm-pack so npm publish does not ignore build outputs
          rm -f .gitignore node/.gitignore web/.gitignore

          npm pkg set publishConfig.access="public" publishConfig.registry="https://registry.npmjs.org/" repository.url="git+https://github.com/RoganMatrivski/layout-gen.git"

      - name: Publish to NPM
        run: |
          cd wasm/pkg
          npm publish
